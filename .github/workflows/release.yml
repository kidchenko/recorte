name: release

# A pushed v* tag builds the Windows installer and portable exe, publishes
# them as a GitHub Release with SHA256SUMS.txt, and hands the new version to
# Chocolatey and winget. macOS and Linux join once their capture, clipboard
# and hotkey are written.
#
# Release with:  cargo tray release patch --push   (or tag vX.Y.Z by hand)
# The tag must match [package].version in Cargo.toml.
#
# A manual run (Actions tab) is a dry run: it builds and packages everything
# and uploads it as run artifacts, but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the one job that publishes asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          manifest="$(awk '/^\[/{p=($0=="[package]")} p&&/^version[[:space:]]*=/{split($0,a,"\"");print a[2];exit}' Cargo.toml)"
          [ -n "$manifest" ] || { echo "::error::no [package].version"; exit 1; }
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            v="${BASH_REMATCH[1]}"
            if [ "$v" != "$manifest" ]; then
              echo "::error::tag v$v does not match Cargo.toml version $manifest"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            v="$manifest"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # traykit is private: cargo fetches it with git, which this token lets
      # through. A fine-grained token with read access to that one repo.
      - name: traykit access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.TRAYKIT_TOKEN }}@github.com/kidchenko/traykit".insteadOf "https://github.com/kidchenko/traykit"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer + portable exe
        shell: pwsh
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: .\build.ps1
      - name: Update Chocolatey and winget manifests
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $sha = (Get-FileHash "dist\Recorte-Setup-$v.exe" -Algorithm SHA256).Hash
          $today = Get-Date -Format 'yyyy-MM-dd'
          # The version the files currently hold is discovered, not assumed.
          $stale = ([regex]'\d+\.\d+\.\d+').Match(
            (Get-Content packaging\choco\tools\chocolateyinstall.ps1 -Raw)).Value
          $pattern = [regex]::Escape($stale)

          (Get-Content packaging\choco\tools\chocolateyinstall.ps1) `
            -replace "checksum64(\s*)= '.*'", "checksum64`$1= '$sha'" -replace $pattern, $v |
            Set-Content packaging\choco\tools\chocolateyinstall.ps1
          Get-ChildItem packaging\winget\*.yaml | ForEach-Object {
            (Get-Content $_) -replace '^(\s*InstallerSha256:\s*).*$', "`${1}$sha" `
              -replace $pattern, $v -replace '^(ReleaseDate:\s*).*$', "`${1}$today" |
              Set-Content $_
          }
          choco pack packaging\choco\recorte.nuspec --version $v --outputdirectory dist
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-winget
          path: packaging/winget/*.yaml

  release:
    needs: [version, windows]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "windows"
          merge-multiple: true
      - name: Checksums
        # Only what gets attached to the release; the .nupkg goes to Chocolatey.
        run: |
          cd dist
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/*.exe dist/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Recorte ${TAG#v}" --verify-tag --generate-notes
          fi

  # Optional: only runs when the CHOCO_API_KEY secret is set. New packages go
  # through community moderation, so the first push takes a while to appear.
  chocolatey:
    needs: [version, release]
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.CHOCO_API_KEY != ''
        with:
          name: windows
          path: dist
      - name: Push to community.chocolatey.org
        if: env.CHOCO_API_KEY != ''
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\*.nupkg | Select-Object -First 1
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  # Optional: only runs when the WINGET_TOKEN secret is set (a classic token
  # with public_repo; the pull request to microsoft/winget-pkgs comes from that
  # account's fork). It can only add a version to a package that is already in
  # winget-pkgs, so the first version of each app was submitted by hand.
  winget:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Open a pull request on microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: kidchenko.Recorte
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '-Setup-[0-9.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

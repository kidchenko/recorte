name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # All three, always: each platform's code is cfg-gated, so a change
        # that builds on one can still break another.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # traykit is private: cargo fetches it with git, which this token lets
      # through. A fine-grained token with read access to that one repo.
      - name: traykit access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.TRAYKIT_TOKEN }}@github.com/kidchenko/traykit".insteadOf "https://github.com/kidchenko/traykit"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

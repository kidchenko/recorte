ShortDescription: A snipping tool in the tray, on Win+Shift+S
Description: |-
  Press Win+Shift+S, drag across any part of the screen, and it's on the
  clipboard. An editor opens with it: pen, highlighter, arrow, box and
  pixelate blur, with undo, then copy or save.

  Recorte takes Win+Shift+S over from Windows' Snipping Tool while it runs.
